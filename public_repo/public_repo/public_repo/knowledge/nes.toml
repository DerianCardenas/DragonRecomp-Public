# DragonRecomp Global Knowledge Base — NES (6502)
# Base de conocimientos compartida para todas las ROMs de NES.
# Al probar cualquier juego, DragonRecomp consulta este archivo para prevenir
# y corregir automáticamente problemas conocidos de mappers, audio y video.

[platform]
name = "NES"
cpu  = "6502"
apu  = "2A03"
ppu  = "2C02"

[[rules]]
id = "mmc3_hudson_nmi_reentrancy"
description = "Los juegos con MMC3 (Mapper 4) como Adventure Island 2/3 ejecutan apagado y sincronización PPU dentro de NMI esperando el siguiente VBLANK; requieren reentrancia completa de NMI."
mappers = [4]
reentrant_nmi = true
safe_boot_frames = 120

[[rules]]
id = "rts_jump_table_continuous_dispatch"
description = "Los motores de sonido y lógica que usan trampolines de retorno RTS (LDA ..; PHA; LDA ..; PHA; RTS) requieren que runtime_dispatch continúe en bucle sin abandonar marcos llamadores."
continuous_dispatch = true

[[rules]]
id = "cnrom_chr_bankswitch"
description = "Mapper 3 (CNROM) cambia bancos CHR en escrituras a $8000-$FFFF sin alterar PRG."
mappers = [3]

[[rules]]
id = "uxrom_prg_bankswitch"
description = "Mapper 2 (UxROM) conmuta bancos PRG de 16 KB en $8000-$BFFF mientras que $C000-$FFFF permanece fijo en el último banco."
mappers = [2]

[[rules]]
id = "mmc1_shift_register_reset"
description = "Mapper 1 (MMC1) reinicia su registro de desplazamiento de 5 bits cuando se escribe cualquier valor con el bit 7 activo ($80)."
mappers = [1]

[[rules]]
id = "vs_system_mapper99_arcade"
description = "Los juegos arcade Nintendo Vs. System (Mapper 99 / iNES flag 7) requieren paleta RGB scrambled (RP2C04-0001..0004 o 2C03), conmutación CHR en $4016 bit 2 y lectura de pulsos de monedas en $4016 bits 5-6."
mappers = [99]
is_vs_system = true
default_palette = "vs0002"
coin_input = true
