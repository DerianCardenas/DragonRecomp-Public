# DragonRecomp Global Knowledge Base — SNES (65816)
# Base de conocimientos compartida para todas las ROMs de SNES.
# Al probar cualquier juego, DragonRecomp consulta este archivo para prevenir
# y corregir automáticamente problemas conocidos de audio SPC700, PPU y memoria.

[platform]
name = "SNES"
cpu  = "65816"
apu  = "SPC700 / S-DSP"
ppu  = "S-PPU1 / S-PPU2"

[[rules]]
id = "spc700_full_instruction_sync"
description = "Sincronización de ciclo precisa y soporte del conjunto completo de 256 opcodes del coprocesador de audio SPC700 para evitar congelamientos en handshakes de puertos $2140-$2143."
apu_sync = true

[[rules]]
id = "snes_controller_serial_msb"
description = "Lectura serial de 16 bits en mandos SNES con protocolo MSB-first en registros $4016/$4017 (B, Y, Select, Start, Up, Down, Left, Right, A, X, L, R)."
controller_msb = true

[[rules]]
id = "wai_non_blocking_interrupt"
description = "Emisión de WAI ($CB) sin retorno prematuro para no romper la pila de llamadas host en C, despachando IRQ durante NMI si CLI está activo."
wai_safe_mode = true

[[rules]]
id = "rgba8888_texture_format"
description = "La presentación visual de S-PPU en SDL3 debe realizarse estrictamente en formato de píxeles SDL_PIXELFORMAT_RGBA8888 para preservar la fidelidad de color."
rgba8888 = true

[[rules]]
id = "jsl_inline_jump_engines"
description = "Soporte de motores de salto en línea invocados mediante JSL ($22) con desapilado del retorno de la pila host y preservación de tablas de punteros de 16/24 bits (e.g. Super Mario World $86DF y $86FA)."
jump_engine_jsl = true

[[rules]]
id = "wram_dynamic_execution_isolation"
description = "Aislamiento estricto de bancos de memoria RAM de trabajo WRAM ($7E-$7F) para impedir despachos estáticos erróneos a ROM y asegurar ejecución ciclo a ciclo en el intérprete cuando los juegos ejecutan rutinas cargadas dinámicamente en RAM."
wram_isolation = true

[[rules]]
id = "coroutine_irq_nmi_context_switch"
description = "Soporte de cambio de contexto por corrutinas en manejadores NMI/IRQ (runtime_poll respeta el PB:PC desapilado por RTI y continúa ejecutando el hilo secundario tras cambios de pila TCS/TXS hasta que una interrupción posterior restaura el hilo principal, requerido por Zelda: A Link to the Past)."
coroutine_context_switch = true

[[rules]]
id = "interprocedural_mx_and_php_plp"
description = "Propagación inter-procedimental del estado M/X al retornar de subrutinas (RTS/RTL -> JSR/JSL), rastreo de PHP/PLP intra-procedimental y generación de las 4 variantes nativas (m1x1, m0x1, m1x0, m0x0) para vectores NMI/IRQ."
interprocedural_mx = true

[[rules]]
id = "zero_sram_open_bus_and_double_smc"
description = "Cartuchos sin SRAM declarada (0 KiB) ni batería mantienen $70-$7D:0000-7FFF en open-bus para superar protecciones anticopia (e.g. Street Fighter 5 Hack), y el cargador recorta cabeceras copiadoras dobles de 1024 bytes (size % 0x8000 == 1024)."
zero_sram_open_bus = true
