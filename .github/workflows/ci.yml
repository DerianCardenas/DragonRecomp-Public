name: ci

# Hosted CI (spec 003, ADR-006, "Nivel A"): build + unit tests + E2E that need
# no commercial ROM, on a clean checkout, for every push and PR. This is the
# shared gate for every committer (no bypass, unlike a local pre-push hook).
#
# ROM-gated tests (boot/recomp tests for SMB, DK, SMW, ...) are SKIPPED here
# because `roms/` is gitignored and no commercial ROM is ever committed or
# downloaded by this workflow. They run on the self-hosted tier instead
# (.github/workflows/e2e-roms.yml) against the maintainer's own ROM library,
# resolved by DRAGON_ROM_DIR + SHA-1 (see common/include/dragon/rom_locator.h).
# CTest must report them as "Skipped", never "Passed" (SKIP_RETURN_CODE 77).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
        # SDL3 is optional (find_package(SDL3 CONFIG QUIET) in */runtime/CMakeLists.txt):
        # when absent, each runtime's frontend/window support is compiled out
        # and headless tests still build and run, so CI does not need it.

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        # DRAGON_BUILD_STUDIO is OFF here: studio/CMakeLists.txt does a hard
        # find_package(SDL3 CONFIG REQUIRED), and SDL3 availability on a bare
        # hosted runner's package repos is not guaranteed. The four
        # recompilers/runtimes (the actual surface the milestones in
        # docs/MILESTONES.md claim) build and test fully without it, since
        # their own SDL3 lookup is optional (QUIET) with a headless fallback.
        # Studio continues to be verified on the self-hosted tier, where SDL3
        # is already installed (see e2e-roms.yml).
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDRAGON_BUILD_STUDIO=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows-mingw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW-w64 & Ninja
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=C:/msys64/mingw64/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=C:/msys64/mingw64/bin/g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDRAGON_BUILD_STUDIO=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
