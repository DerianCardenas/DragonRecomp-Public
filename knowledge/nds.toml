# Nintendo DS (NTR-001) Hardware & Recompilation Knowledge Base

[platform]
name = "Nintendo DS"
id = "nds"
cpu_main = "ARM946E-S (ARMv5TE + Thumb + CP15)"
cpu_sub = "ARM7TDMI (ARMv4T + Thumb)"
clock_main_hz = 67027964
clock_sub_hz = 33513982
screen_width = 256
screen_height = 384
single_screen_height = 192
fps = 59.8261

[memory]
main_ram_base = 0x02000000
main_ram_size = 0x00400000
itcm_size = 0x00008000
dtcm_size = 0x00004000
shared_wram_size = 0x00008000
arm7_wram_size = 0x00010000
vram_total_kb = 656

[quirks]
# ARMv5TE loads into PC (LDR PC / LDM {..., PC}) switch Thumb state based on bit 0.
arm9_ldr_pc_interworking = true
# ARM7TDMI (ARMv4T) loads into PC do NOT switch Thumb state.
arm7_ldr_pc_interworking = false
# Game code is loaded from cartridge into Main RAM rather than XIP from ROM.
code_in_ram = true
# NitroSDK games rely on ARM9 <-> ARM7 IPCSYNC and IPCFIFO handshake at boot.
requires_ipc_handshake = true
# Direct Boot populates 0x027FFE00 header copy and 0x027FFC80 user settings.
direct_boot_info_addr = 0x027FFE00
