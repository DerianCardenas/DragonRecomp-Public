<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Dragon Cyan Gradient -->
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Wing & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00D2D3" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#softShadow)" />

  <!-- Subtle Circuit / Retro Grid Pattern Behind -->
  <g opacity="0.12" stroke="#00D2D3" stroke-width="2">
    <path d="M 80 120 L 160 120 L 200 160 M 320 160 L 360 120 L 440 120" />
    <path d="M 80 400 L 150 400 L 190 360 M 330 360 L 370 400 L 440 400" />
    <circle cx="200" cy="160" r="4" fill="#00D2D3" />
    <circle cx="320" cy="160" r="4" fill="#00D2D3" />
    <circle cx="190" cy="360" r="4" fill="#00D2D3" />
    <circle cx="330" cy="360" r="4" fill="#00D2D3" />
  </g>

  <!-- Stylized Geometric Cyber Dragon Emblem -->
  <g transform="translate(0, 10)">
    <!-- Dragon Wings / Halo (Low Poly Facets) -->
    <path d="M 120 220 L 256 120 L 190 280 Z" fill="url(#accentGrad)" opacity="0.8" />
    <path d="M 392 220 L 256 120 L 322 280 Z" fill="url(#accentGrad)" opacity="0.8" />

    <path d="M 80 290 L 180 270 L 130 340 Z" fill="url(#accentGrad)" opacity="0.5" />
    <path d="M 432 290 L 332 270 L 382 340 Z" fill="url(#accentGrad)" opacity="0.5" />

    <!-- Dragon Head & Crest -->
    <!-- Central Crown / Horns -->
    <polygon points="256,90 220,180 256,160 292,180" fill="#00D2D3" filter="url(#glow)" />
    <!-- Left Horn -->
    <polygon points="220,170 170,110 190,195" fill="url(#dragonGrad)" />
    <!-- Right Horn -->
    <polygon points="292,170 342,110 322,195" fill="url(#dragonGrad)" />

    <!-- Main Face Facets -->
    <polygon points="256,160 190,195 230,270 256,250" fill="#38bdf8" />
    <polygon points="256,160 322,195 282,270 256,250" fill="#0284c7" />

    <!-- Cheeks / Jaws -->
    <polygon points="190,195 150,260 230,270" fill="#0ea5e9" />
    <polygon points="322,195 362,260 282,270" fill="#0369a1" />

    <!-- Snout & Mouth -->
    <polygon points="256,250 230,270 240,320 256,335" fill="#38bdf8" />
    <polygon points="256,250 282,270 272,320 256,335" fill="#0284c7" />

    <!-- Glowing Cyber Eyes -->
    <polygon points="215,225 240,230 225,240" fill="#ffffff" filter="url(#glow)" />
    <polygon points="297,225 272,230 287,240" fill="#ffffff" filter="url(#glow)" />
    <polygon points="218,227 236,231 226,237" fill="#00ffff" />
    <polygon points="294,227 276,231 286,237" fill="#00ffff" />

    <!-- Energy Recompilation Core (Center Chest / Gem) -->
    <polygon points="256,340 225,385 256,420 287,385" fill="url(#dragonGrad)" stroke="#00D2D3" stroke-width="3" filter="url(#glow)" />
    <polygon points="256,355 238,385 256,408 274,385" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Retro Pixel D-Pad Accent at Bottom Center -->
  <g transform="translate(256, 442) scale(0.7)" opacity="0.75">
    <rect x="-35" y="-10" width="70" height="20" rx="3" fill="#334155" stroke="#00D2D3" stroke-width="2" />
    <rect x="-10" y="-35" width="20" height="70" rx="3" fill="#334155" stroke="#00D2D3" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#00D2D3" />
  </g>
</svg>
